 room. He appears tense and has a strained expression on his face. He states, “My mouth is so dry.” The nurse observes his vital signs to be: T 98, P 104, R 30, BP 180/96. The nurse notes that his skin feels sweaty (diaphoretic) and cool to the touch.\n\n1. Group (cluster) the cues (subjective and objective data).\n\n2. Create a problem-focused nursing diagnosis (hypothesis).\n\n3. Develop a broad goal and then identify an expected outcome in “SMART” format.\n\n4. Outline three interventions for the nursing diagnosis to meet the goal and their rationale. Cite an evidence-based source for the interventions and rationale\n\n5. Imagine that you implemented the interventions that you identified. Evaluate the degree to which the expected outcome was achieved: Met – Partially Met – Not Met.", "reference": null, "distractors": [], "char_count": 1743, "fits_500_char_limit": false, "layout": "single_column_stem_only"}, "after": {"stem": "He keeps asking the nurse the same question (“How long will the tests take?”) about his tests over and over again. The client also remarked, “I’m so uptight I will never be able to sleep tonight.” The nurse observes that the client avoids eye contact during their interactions and that he continually fidgets with the call light. His eyes keep darting around the room. He appears tense and has a strained expression on his face. He states, “My mouth is so dry.” The nurse observes his vital signs to be: T 98, P 104, R 30, BP 180/96. The nurse notes that his skin feels sweaty (diaphoretic) and cool to the touch.\n\n1. Group (cluster) the cues (subjective and objective data).\n\n2. Create a problem-focused nursing diagnosis (hypothesis).\n\n3. Develop a broad goal and then identify an expected outcome in “SMART” format.\n\n4. Outline three interventions for the nursing diagnosis to meet the goal and their rationale. Cite an evidence-based source for the interventions and rationale\n\n5. Imagine that you implemented the interventions that you identified. Evaluate the degree to which the expected outcome was achieved: Met – Partially Met – Not Met.", "reference": "Instructions: Apply what you’ve learned in this chapter by creating a nursing care plan using the following scenario. Use the template in Appendix B as a guide.The client, Mark S., is a 57-year-old male who was admitted to the hospital with “severe” abdominal pain that was unable to be managed in the Emergency Department. The physician has informed Mark that he will need to undergo some diagnostic tests. The tests are scheduled for the morning.\n\nAfter receiving the news about his condition and the need for diagnostic tests, Mark begins to pace the floor. He continues to pace constantly.", "distractors": [], "metadata": null, "response_template": null, "matching_rows": [], "option_groups": [], "depends_on_item_ids": [], "context_reuse": [], "stem_char_count": 1147, "reference_char_count": 593, "fits_500_char_limit": false, "layout": "split_screen_with_reference"}, "verification": {"characters_added": 0, "characters_removed": 0, "exact_match": true, "order_matches": true, "stem_under_500": false, "review_gated": true}}, {"id": "Q006", "parent_id": "Q006", "domain": "Clinical Nursing", "response_kind": "short_answer", "disposition": "needs_review", "passed": false, "before": {"stem": "Handoff Report\n\nMr. Moore is a 72-year-old widower recovering in the hospital after sustaining injuries he received from a fall at home. See Figure 5.15 for an image of Mr. Moore.[1] He fractured his right hip and underwent surgical repair two days ago. He is receiving IV fluids and morphine for pain control. He has a history of hypertension and cardiovascular disease. He wears glasses and hearing aids. Per recommendations from the physical therapist, he is able to transfer with one assist with a walker but is weak on his right side. He has an order to ambulate at least 100 feet four times daily with a wheeled walker. He is 6 feet tall and weighs 165 pounds. Prior to the fall, he lived at home alone independently, and he is looking forward to returning home.\n\nAssessment\n\nThe nurse collects the following assessment findings:\n\nVital Signs: Blood pressure 90/60, heart rate 56, respiratory rate 18, temperature 37 degrees Celsius, pulse oximetry reading 92%, current pain level 0\n\nAlert and oriented x 3 to person, place, and time\n\nLungs clear\n\nCardiovascular Assessment: Heart rate is regular, capillary refill less than 3 seconds in fingers and toes, pedal pulses 2+\n\nRight lower extremity strength is 1+ (weak)\n\nAmbulates with walker with assistance; gait is unsteady\n\nCritical Thinking Questions\n\n1. Describe the fall risk factors for Mr. Moore.", "reference": null, "distractors": [], "char_count": 1358, "fits_500_char_limit": false, "layout": "single_column_stem_only"}, "after": {"stem": "Handoff Report\n\nMr. Moore is a 72-year-old widower recovering in the hospital after sustaining injuries he received from a fall at home. See Figure 5.15 for an image of Mr. Moore.[1] He fractured his right hip and underwent surgical repair two days ago. He is receiving IV fluids and morphine for pain control. He has a history of hypertension and cardiovascular disease. He wears glasses and hearing aids. Per recommendations from the physical therapist, he is able to transfer with one assist with a walker but is weak on his right side. He has an order to ambulate at least 100 feet four times daily with a wheeled walker. He is 6 feet tall and weighs 165 pounds. Prior to the fall, he lived at home alone independently, and he is looking forward to returning home.\n\nAssessment\n\nThe nurse collects the following assessment findings:\n\nVital Signs: Blood pressure 90/60, heart rate 56, respiratory rate 18, temperature 37 degrees Celsius, pulse oximetry reading 92%, current pain level 0\n\nAlert and oriented x 3 to person, place, and time\n\nLungs clear\n\nCardiovascular Assessment: Heart rate is regular, capillary refill less than 3 seconds in fingers and toes, pedal pulses 2+\n\nRight lower extremity strength is 1+ (weak)\n\nAmbulates with walker with assistance; gait is unsteady\n\nCritical Thinking Questions\n\n1. Describe the fall risk factors for Mr. Moore.", "reference": null, "distractors": [], "metadata": null, "response_template": null, "matching_rows": [], "option_groups": [], "depends_on_item_ids": [], "context_reuse": [], "stem_char_count": 1358, "reference_char_count": 0, "fits_500_char_limit": false, "layout": "single_column_stem_only"}, "verification": {"characters_added": 0, "characters_removed": 0, "exact_match": true, "order_matches": true, "stem_under_500": false, "review_gated": true}}, {"id": "Q007", "parent_id": "Q007", "domain": "Clinical Nursing", "response_kind": "short_answer", "disposition": "proposed", "passed": true, "before": {"stem": "The following day, upon entering the room, you find Mr. Moore has climbed out of bed and is on his way to the bathroom. He states, “I need to go to the bathroom for a bowel movement and didn’t have time to ring the call light and wait.” You assist him with his walker, but he seems unsteady on his feet as he walks toward the bathroom. You’re not sure if he will make it to the toilet without falling. He says, “We need to hurry or I’m not going to make it.”\n\nCritical Thinking Question\n\n4. What is the best response?", "reference": null, "distractors": [], "char_count": 517, "fits_500_char_limit": false, "layout": "single_column_stem_only"}, "after": {"stem": "What is the best response?", "reference": "The following day, upon entering the room, you find Mr. Moore has climbed out of bed and is on his way to the bathroom. He states, “I need to go to the bathroom for a bowel movement and didn’t have time to ring the call light and wait.” You assist him with his walker, but he seems unsteady on his feet as he walks toward the bathroom. You’re not sure if he will make it to the toilet without falling. He says, “We need to hurry or I’m not going ": "offline-autonomous-semantic-parser", "model": "offline-rule-based", "prompt_hash": "", "source_hash": "c5ff51e584c6fc448b815aa46a625aeb7313707f3546f43a82d24ca917106cc6", "status": "success", "retries_used": 0}, {"engine": "offline-autonomous-semantic-parser", "model": "offline-rule-based", "prompt_hash": "", "source_hash": "13b28c815d7a27d1cad6ed53f02a2433cb147b67d94edd11ee376748d7a05754", "status": "success", "retries_used": 0}, {"engine": "offline-autonomous-semantic-parser", "model": "offline-rule-based", "prompt_hash": "", "source_hash": "1df494cb6c5c17f2286612be0909c7df3c004181077c3fe59e49b0f8b326afa2", "status": "success", "retries_used": 0}, {"engine": "offline-autonomous-semantic-parser", "model": "offline-rule-based", "prompt_hash": "", "source_hash": "487476bc6c7cd239228f4843efa0e5149153bf90cd0d1f15e048411243f20b01", "status": "success", "retries_used": 0}, {"engine": "offline-autonomous-semantic-parser", "model": "offline-rule-based", "prompt_hash": "", "source_hash": "5133b8cc9549375c21c95ada13a345ed84b80aa3eefd7dec920529404c411451", "status": "success", "retries_used": 0}, {"engine": "offline-autonomous-semantic-parser", "model": "offline-rule-based", "prompt_hash": "", "source_hash": "461572399e000ba3b887bdb577193e1e7796d29c5622c21840acec0fcae1361b", "status": "success", "retries_used": 0}, {"engine": "offline-autonomous-semantic-parser", "model": "offline-rule-based", "prompt_hash": "", "source_hash": "045e76c9e58c9b90cc94c36a6ec799fc297d9a427fd34c41fa107c80b7822056", "status": "success", "retries_used": 0}, {"engine": "offline-autonomous-semantic-parser", "model": "offline-rule-based", "prompt_hash": "", "source_hash": "808ecb39afdd5f6ffd36484a31fb97d9a209c719de2496da3bb160e0a872ef99", "status": "success", "retries_used": 0}, {"engine": "offline-autonomous-semantic-parser", "model": "offline-rule-based", "prompt_hash": "", "source_hash": "0092de113a08b8d53d667a601fa34c8b01a81626ba90c2c52cf32b280ddd1c83", "status": "success", "retries_used": 0}]};
    let currentQ = DATA.questions[0];
    let currentViewMode = 'after'; // 'before' | 'after'
    let currentFilter = 'all';
    let searchQuery = '';

    function init() {
      updateCounts();
      renderSidebar();
      selectQuestion(DATA.questions[0].id);
    }

    function updateCounts() {
      document.getElementById('count-all').textContent = DATA.questions.length;
      document.getElementById('count-split').textContent = DATA.questions.filter(q => q.after.layout === 'split_screen_with_reference').length;
      document.getElementById('count-single').textContent = DATA.questions.filter(q => q.after.layout === 'single_column_stem_only').length;
      document.getElementById('count-sub').textContent = DATA.questions.filter(q => q.id.includes('-')).length;
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tag-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      renderSidebar();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
      renderSidebar();
    }

    function getFilteredQuestions() {
      return DATA.questions.filter(q => {
        // Filter tag check
        if (currentFilter === 'split' && q.after.layout !== 'split_screen_with_reference') return false;
        if (currentFilter === 'single' && q.after.layout !== 'single_column_stem_only') return false;
        if (currentFilter === 'sub' && !q.id.includes('-')) return false;

        // Search check
        if (searchQuery) {
          const qText = (q.before.stem + ' ' + (q.after.stem || '') + ' ' + (q.after.reference || '')).toLowerCase();
          return q.id.toLowerCase().includes(searchQuery) || qText.includes(searchQuery);
        }
        return true;
      });
    }

    function renderSidebar() {
      const listEl = document.getElementById('questionList');
      listEl.innerHTML = '';
      const filtered = getFilteredQuestions();

      filtered.forEach(q => {
        const item = document.createElement('div');
        item.className = 'q-item' + (currentQ && currentQ.id === q.id ? ' active' : '');
        item.onclick = () => selectQuestion(q.id);

        const isSplit = q.after.layout === 'split_screen_with_reference';
        const isSub = q.id.includes('-');
        
        let badgeHtml = '';
        if (isSub) {
          badgeHtml = '<span class="layout-badge badge-sub">SUB</span>';
        } else if (isSplit) {
          badgeHtml = '<span class="layout-badge badge-split">SPLIT</span>';
        } else {
          badgeHtml = '<span class="layout-badge badge-single">SINGLE</span>';
        }

        item.innerHTML = `
          <div>
            <div style="display:flex; align-items:center; gap:6px;">
              <span class="q-item-id">${q.id}</span>
              ${badgeHtml}
            </div>
            <div class="q-item-meta">
              <span>${q.domain || 'Clinical'}</span>
            </div>
          </div>
          <div style="text-align:right;">
            <div class="q-item-stem-len">${q.after.stem_char_count}c</div>
            <div style="font-size:9.5px; color:var(--text-muted);">${isSplit ? q.after.reference_char_count + 'c ref' : 'no ref'}</div>
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    function selectQuestion(qid) {
      currentQ = DATA.questions.find(q => q.id === qid);
      if (!currentQ) return;

      document.querySelectorAll('.q-item').forEach(el => {
        el.classList.toggle('active', el.querySelector('.q-item-id').textContent === qid);
      });

      document.getElementById('currentQId').textContent = currentQ.id;
      document.getElementById('currentDomain').textContent = currentQ.domain || 'Clinical Nursing';

      const v = currentQ.verification;
      const verifEl = document.getElementById('currentVerif');
      if (v.exact_match && v.stem_under_500) {
        verifEl.style.color = '#10b981';
        verifEl.style.background = 'rgba(16, 185, 129, 0.12)';
        verifEl.innerHTML = `<svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Exact Match: 0 Added, 0 Removed (&le; 500c)`;
      } else {
        verifEl.style.color = '#f43f5e';
        verifEl.style.background = 'rgba(244, 63, 94, 0.12)';
        verifEl.innerHTML = `Mismatch / Over limit`;
      }

      renderView();
    }

    function setCurrentView(mode) {
      currentViewMode = mode;
      document.getElementById('btnBefore').classList.toggle('active', mode === 'before');
      document.getElementById('btnAfter').classList.toggle('active', mode === 'after');
      renderView();
    }

    function toggleAllView(mode) {
      setCurrentView(mode);
    }

    function renderView() {
      const canvas = document.getElementById('renderCanvas');
      if (!currentQ) return;

      if (currentViewMode === 'before') {
        renderBeforeView(canvas);
      } else {
        renderAfterView(canvas);
      }
    }

    function renderBeforeView(container) {
      const raw = currentQ.before.stem;
      const len = currentQ.before.char_count;
      const fits = currentQ.before.fits_500_char_limit;

      container.innerHTML = `
        <div class="exam-frame">
          <div class="exam-header">
            <span>BEFORE: Raw Input String Layout (Single Block)</span>
            <span>Total Length: <strong>${len} characters</strong> ${fits ? '<span class="stem-badge-tag stem-under-badge">&le; 500c</span>' : '<span class="stem-badge-tag stem-over-badge">EXCEEDS 500c LIMIT</span>'}</span>
          </div>
          <div class="before-view-pane">
            <div class="before-banner">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
              <span>Unparsed Item: Clinical case, prompt, and distractors were lumped together into a single block.</span>
            </div>
            <pre style="font-family:var(--font-ui); font-size:14.5px; line-height:1.7; white-space:pre-wrap; color:#1e293b;">${escapeHtml(raw)}</pre>
          </div>
        </div>
      `;
    }

    function renderAfterView(container) {
      const q = currentQ.after;
      const hasRef = !!q.reference;

      let optionsHtml = '';
      if (q.distractors && q.distractors.length > 0) {
        optionsHtml = '<div class="options-list">';
        q.distractors.forEach(opt => {
          const lines = opt.split('\n');
          lines.forEach(l => {
            if (l.trim()) {
              optionsHtml += `<div class="option-row"><span>${escapeHtml(l)}</span></div>`;
            }
          });
        });
        optionsHtml += '</div>';
      }

      if (hasRef) {
        // Split screen layout
        container.innerHTML = `
          <div class="exam-frame">
            <div class="exam-header">
              <span>AFTER: Split-Screen View (Reference Panel Left | Stem & Options Right)</span>
              <span>Layout: <strong>split_screen_with_reference</strong></span>
            </div>
            <div class="exam-split-body">
              <div class="exam-ref-pane">
                <h4>
                  <span>CLINICAL REFERENCE / SCENARIO</span>
                  <span style="font-family:var(--font-code); font-size:11px;">${q.reference_char_count} chars</span>
                </h4>
                <div style="white-space:pre-wrap; font-size:13.5px; line-height:1.65; color:#334155;">${escapeHtml(q.reference)}</div>
              </div>
              <div class="exam-stem-pane">
                <div>
                  <div style="font-size:11px; text-transform:uppercase; font-weight:700; color:#64748b; margin-bottom:6px;">
                    QUESTION STEM
                    <span class="stem-badge-tag stem-under-badge">${q.stem_char_count} / 500 chars (&le; 500 limit)</span>
                  </div>
                  <div class="exam-stem-text" style="white-space:pre-wrap;">${escapeHtml(q.stem)}</div>
                </div>
                <div>
                  <div style="font-size:11px; text-transform:uppercase; font-weight:700; color:#64748b; margin-bottom:6px;">ANSWER CHOICES</div>
                  ${optionsHtml}
                </div>
              </div>
            </div>
          </div>
        `;
      } else {
        // Single column layout (e.g. Q063)
        container.innerHTML = `
          <div class="exam-frame">
            <div class="exam-header">
              <span>AFTER: Single-Column View (No Exhibit -> Instruction Kept in Stem)</span>
              <span>Layout: <strong>single_column_stem_only</strong></span>
            </div>
            <div class="before-view-pane" style="max-width:850px; margin:0 auto; width:100%;">
              <div style="margin-bottom:20px;">
                <div style="font-size:11px; text-transform:uppercase; font-weight:700; color:#64748b; margin-bottom:6px;">
                  QUESTION STEM
                  <span class="stem-badge-tag stem-under-badge">${q.stem_char_count} / 500 chars (&le; 500 limit)</span>
                </div>
                <div class="exam-stem-text" style="font-size:16px; white-space:pre-wrap;">${escapeHtml(q.stem)}</div>
              </div>
              <div>
                <div style="font-size:11px; text-transform:uppercase; font-weight:700; color:#64748b; margin-bottom:8px;">ANSWER CHOICES</div>
                ${optionsHtml}
              </div>
            </div>
          </div>
        `;
      }
    }

    function openJSONModal() {
      if (!currentQ) return;
      document.getElementById('modalQId').textContent = currentQ.id;
      document.getElementById('modalCode').textContent = JSON.stringify(currentQ, null, 2);
      document.getElementById('jsonModal').classList.add('active');
    }

    function closeJSONModal() {
      document.getElementById('jsonModal').classList.remove('active');
    }

    function copyModalJSON() {
      const text = document.getElementById('modalCode').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('copyToast');
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
      });
    }

    function downloadJSON() {
      const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'review_output.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    window.onload = init;
  </script>
</body>
